{% extends "base.html" %}
{% block title %}Nuestra Solución en Acción - Pasto.AI{% endblock %}
{% block content %}
<main class="presentation-container">
    <!-- ESCENA 1: LOS PROBLEMAS QUE DUELEN -->
    <section class="presentation-slide" id="slide-problema">
        <div class="slide-content">
            <h2 class="section-title" id="problema-title" style="color: #FF4444;"></h2>
            <div class="problemas-container">
                <div class="problema-card"><h3></h3><p></p></div>
                <div class="problema-card"><h3></h3><p></p></div>
                <div class="problema-card"><h3></h3><p></p></div>
            </div>
        </div>
    </section>

    <!-- ESCENA 2: LA MAGIA DE PASTO.AI -->
    <section class="presentation-slide is-hidden" id="slide-solucion">
        <div class="slide-content">
            <h2 class="section-title" id="solucion-title" style="color: #00BFFF;"></h2>
            <div class="agent-showcase-grid">
                <!-- Tarjeta 1: Salud -->
                <div class="agent-showcase-card">
                    <div class="agent-icon">🩺</div><h3></h3><p></p>
                    <a href="{{ url_for('detalle_agente', slug='asistente-post-operatorio') }}" class="card-link"></a>
                </div>
                <!-- Tarjeta 2: Pastelería -->
                <div class="agent-showcase-card">
                    <div class="agent-icon">🍰</div><h3></h3><p></p>
                    <a href="{{ url_for('detalle_agente', slug='ventas-gastronomia') }}" class="card-link"></a>
                </div>
                <!-- Tarjeta 3: Eventos -->
                <div class="agent-showcase-card">
                    <div class="agent-icon">🥂</div><h3></h3><p></p>
                    <a href="{{ url_for('detalle_agente', slug='eventos-sociales') }}" class="card-link"></a>
                </div>
            </div>
        </div>
    </section>
</main>

<script>
    document.addEventListener('DOMContentLoaded', async function() {
        // --- TEXTOS PARA EL "WOO" ---
        const problemaTitleText = "¿Su negocio se siente estancado por estas razones?";
        const problemas = [
            { el: document.querySelector('#slide-problema .problema-card:nth-child(1)'), title: 'Horas Perdidas en WhatsApp', text: 'Usted o su equipo pasan el día respondiendo lo mismo una y otra vez en lugar de producir.' },
            { el: document.querySelector('#slide-problema .problema-card:nth-child(2)'), title: 'Ventas que se escapan', text: 'Un cliente que no recibe respuesta en 5 minutos es una venta que se lleva la competencia.' },
            { el: document.querySelector('#slide-problema .problema-card:nth-child(3)'), title: 'Decisiones sin Datos', text: 'No saber qué es lo que más piden sus clientes le impide crecer con estrategia y orden.' }
        ];

        const solucionTitleText = "La Inteligencia que su empresa necesita hoy";
        const soluciones = [
            { el: document.querySelector('#slide-solucion .agent-showcase-card:nth-child(1)'), title: 'Salud Inteligente', text: 'Seguimiento automático de pacientes y agendamiento 24/7.', link: 'Ver Demo Salud →' },
            { el: document.querySelector('#slide-solucion .agent-showcase-card:nth-child(2)'), title: 'Ventas Gourmet', text: 'Toma de pedidos y gestión de pagos por WhatsApp.', link: 'Ver Demo Gourmet →' },
            { el: document.querySelector('#slide-solucion .agent-showcase-card:nth-child(3)'), title: 'Planner Pro', text: 'Calificación de prospectos y cierre de citas para eventos.', link: 'Ver Demo Eventos →' }
        ];

        // --- MOTOR DE ANIMACIÓN ---
        const problemaTitle = document.getElementById('problema-title');
        const solucionTitle = document.getElementById('solucion-title');
        const slideProblema = document.getElementById('slide-problema');
        const slideSolucion = document.getElementById('slide-solucion');
        const wait = ms => new Promise(res => setTimeout(res, ms));

        function typeWriter(element, text) {
            return new Promise(resolve => {
                let i = 0;
                element.innerHTML = '';
                function type() {
                    if (i < text.length) {
                        element.innerHTML += text.charAt(i);
                        i++;
                        setTimeout(type, 35); 
                    } else { resolve(); }
                }
                type();
            });
        }

        async function startPresentation() {
            // --- PARTE 1: PROBLEMAS ---
            await wait(1000);
            await typeWriter(problemaTitle, problemaTitleText);
            await wait(500);

            for (const problema of problemas) {
                problema.el.classList.add('visible');
                await typeWriter(problema.el.querySelector('h3'), problema.title);
                await typeWriter(problema.el.querySelector('p'), problema.text);
                await wait(800);
            }
            await wait(3000);

            // --- TRANSICIÓN ESTILO CINE ---
            slideProblema.classList.add('is-hidden');
            await wait(800);
            slideSolucion.classList.remove('is-hidden');
            await wait(500);

            // --- PARTE 2: SOLUCIONES ---
            await typeWriter(solucionTitle, solucionTitleText);
            await wait(500);
            
            for (const solucion of soluciones) {
                solucion.el.classList.add('visible');
                await typeWriter(solucion.el.querySelector('h3'), solucion.title);
                await typeWriter(solucion.el.querySelector('p'), solucion.text);
                await typeWriter(solucion.el.querySelector('a'), solucion.link);
                await wait(800);
            }
        }

        startPresentation();
    });
</script>
{% endblock %}
