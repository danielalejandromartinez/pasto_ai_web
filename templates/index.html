{% extends "base.html" %}

{% block title %}Pasto.AI - Inteligencia Artificial para su Negocio{% endblock %}

{% block content %}
<main>
    <!-- ======================================= -->
    <!--     SECCIÓN HERO CON EFECTO DE ESCRITURA   -->
    <!-- ======================================= -->
    <section class="hero">
        <video autoplay loop muted playsinline id="video-fondo">
            <source src="{{ url_for('static', filename='videos/video_fondo.mp4') }}" type="video/mp4">
        </video>
        <div class="hero-content">
            <!-- Estos textos se llenarán con el efecto de máquina de escribir -->
            <h1 id="hero-line-1" style="min-height: 1.2em;"></h1>
            <h2 id="hero-line-2" style="min-height: 1.2em; color: #00BFFF;"></h2>
            <p id="hero-line-3" style="min-height: 3.6em; max-width: 800px;"></p>
            
            <!-- Botones que aparecen al final -->
            <div class="hero-buttons" id="hero-buttons" style="opacity: 0; transition: opacity 1.5s ease;">
                <a href="{{ url_for('catalogo_agentes') }}" class="boton-principal">Explorar Agentes de IA</a>
                <a href="{{ url_for('presentacion') }}" class="boton-secundario">Ver Demostración</a>
            </div>
        </div>
    </section>

</main>

<!-- El script para esta página vive aquí ahora -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // --- TEXTOS DEL FUTURO ---
        const text1 = "IA que piensa. Resultados que escalan.";
        const text2 = "El Cerebro Digital de su Empresa.";
        const text3 = "Desde salud hasta gastronomía: creamos agentes de IA que venden, agendan y atienden por WhatsApp 24/7, liberándolo para que se enfoque en crecer.";

        // Elementos del DOM
        const el1 = document.getElementById('hero-line-1');
        const el2 = document.getElementById('hero-line-2');
        const el3 = document.getElementById('hero-line-3');
        const buttons = document.getElementById('hero-buttons');

        // Función de escritura (Step-by-step)
        function typeWriter(element, text, onComplete) {
            let i = 0;
            element.innerHTML = ''; 
            element.classList.add('typing-cursor'); 

            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, 30); // Velocidad perfecta para leer
                } else {
                    element.classList.remove('typing-cursor'); 
                    if (onComplete) onComplete();
                }
            }
            type();
        }

        // --- ORQUESTA DE ANIMACIÓN ---
        setTimeout(() => {
            typeWriter(el1, text1, () => {
                setTimeout(() => {
                    typeWriter(el2, text2, () => {
                        setTimeout(() => {
                            typeWriter(el3, text3, () => {
                                // Al terminar la última línea, mostramos los botones con suavidad
                                buttons.style.opacity = 1;
                            });
                        }, 500); 
                    });
                }, 600); 
            });
        }, 800); 
    });
</script>
{% endblock %}
